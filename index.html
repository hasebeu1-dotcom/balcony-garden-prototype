<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f4f6ef" />
  <title>ベランダガーデニングロードマップ</title>
  <style>
:root{
  --bg:#f4f6ef;--card:#fff;--text:#253126;--muted:#6e786f;--green:#567f50;--green-dark:#3f663b;
  --green-soft:#e7f0e3;--line:#dbe2d7;--red:#a84c3d;--red-soft:#fff0eb;--amber:#8b6a29;--amber-soft:#fff8e8;
  --shadow:0 10px 28px rgba(63,83,60,.08);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:linear-gradient(#f7f8f4,#edf2e8);color:var(--text)}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation}
.app{max-width:460px;margin:auto;min-height:100vh;background:var(--bg);position:relative}
.screen{min-height:100vh;padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 92px)}
.hero{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px;box-shadow:var(--shadow)}
.tag{font-size:12px;font-weight:800;color:var(--green-dark);letter-spacing:.03em}
h1{font-size:28px;line-height:1.3;margin:8px 0 12px}h2{font-size:21px;line-height:1.35;margin:8px 0 10px}h3{font-size:17px;margin:4px 0 8px}
p{line-height:1.65}.muted{font-size:14px;line-height:1.65;color:var(--muted)}.micro{font-size:12px;color:var(--muted);line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.btn{width:100%;border:0;border-radius:16px;padding:15px 14px;font-weight:800;margin-top:10px;cursor:pointer}
.btn.primary{background:var(--green-dark);color:#fff}.btn.secondary{background:var(--green-soft);color:var(--green-dark)}.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--text)}.btn.danger{background:var(--red-soft);color:var(--red)}
.nav-row{display:flex;gap:10px}.nav-row .btn{flex:1}
.progress{height:8px;border-radius:99px;background:#e4e9e1;overflow:hidden;margin:8px 0 22px}.progress>span{display:block;height:100%;background:var(--green);transition:.2s}
.answer{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:1.5px solid var(--line);background:#fff;border-radius:16px;margin:9px 0;text-align:left;color:var(--text)}
.answer.sel{border-color:var(--green-dark);background:#f4faf2;box-shadow:0 0 0 2px rgba(63,102,59,.06)}
.ico{width:42px;height:42px;border-radius:13px;background:var(--green-soft);display:grid;place-items:center;flex:none;font-size:21px}.mark{margin-left:auto;color:var(--green-dark);font-weight:900}
.region-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.region-grid .answer{margin:0;min-height:62px}
.range-wrap{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0}.range-value{text-align:center;color:var(--green-dark);font-size:31px;font-weight:800;margin:10px 0 18px}.range-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--green-dark)}
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.upload{background:#fff;border:1.5px dashed #bac6b5;border-radius:18px;padding:12px;min-height:154px}.upload input{display:none}.ph{height:92px;border-radius:14px;background:var(--green-soft);display:grid;place-items:center;font-size:31px;overflow:hidden;margin-bottom:8px}.ph img{width:100%;height:100%;object-fit:cover}
.notice,.warn,.caution{padding:14px;border-radius:16px;margin:12px 0;line-height:1.65}.notice{background:#edf4e9}.warn{background:var(--red-soft);border:1px solid #efc5ba}.caution{background:var(--amber-soft);border:1px solid #ead9a5}
.swipe{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;-webkit-overflow-scrolling:touch}.swipe::-webkit-scrollbar{display:none}.slide{min-width:100%;scroll-snap-align:start}.mockimg{height:208px;border-radius:22px;background:linear-gradient(#dbe8d7 0 58%,#d5c1a1 59%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:26px;font-size:54px}.mockimg.future{background:linear-gradient(#d1e3cc 0 52%,#cbb592 53%)}
.pill{display:inline-block;background:var(--green-soft);color:var(--green-dark);padding:6px 10px;border-radius:999px;font-size:12px;margin:3px}.pill.gray{background:#eef0ec;color:#5f665f}.pill.red{background:var(--red-soft);color:var(--red)}
.plant-card{display:grid;grid-template-columns:74px 1fr;gap:12px;align-items:center}.plant-emoji{width:74px;height:74px;border-radius:18px;background:var(--green-soft);display:grid;place-items:center;font-size:36px}.stars{letter-spacing:1px;color:#8b6a29}
.layout-box{position:relative;height:230px;border:1px solid #ddd4c5;background:#f9f6ef;border-radius:20px;overflow:hidden}.rail{position:absolute;top:0;left:0;right:0;height:28px;background:#d8d8d3;text-align:center;font-size:11px;padding:5px}.door{position:absolute;bottom:0;left:37%;width:26%;height:22px;background:#c7b89e;text-align:center;font-size:10px;padding:4px}.zone{position:absolute;padding:8px 10px;border-radius:13px;font-size:12px;font-weight:800}.ok1{left:20px;bottom:56px;background:#dcebd7}.ok2{right:22px;bottom:93px;background:#e6e1c7}.ng1{left:12px;top:44px;background:#ffe7e0;color:#9b4b3b}.ng2{right:12px;top:84px;background:#ffe7e0;color:#9b4b3b}.ng3{left:34%;bottom:22px;background:#ffe7e0;color:#9b4b3b}
.todo-row,.shop-row,.timeline-row{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #edf0eb;align-items:flex-start}.todo-row:last-child,.shop-row:last-child,.timeline-row:last-child{border-bottom:0}.grow{flex:1}.checkline{text-decoration:line-through;color:var(--muted)}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);display:grid;grid-template-columns:repeat(4,1fr);z-index:20;backdrop-filter:blur(12px)}.bottom-nav button{background:none;border:0;padding:7px 3px;font-size:11px;color:var(--muted)}.bottom-nav button strong{display:block;font-size:20px;margin-bottom:2px}.bottom-nav button.active{color:var(--green-dark);font-weight:800}
.section-title{display:flex;justify-content:space-between;gap:12px;align-items:center}.link-btn{border:0;background:none;color:var(--green-dark);font-weight:800;padding:6px 0}.divider{height:1px;background:#edf0eb;margin:12px 0}.empty{padding:22px;text-align:center;color:var(--muted)}
.form-row{margin:12px 0}.form-row label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.text-input,.select-input,.textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px;color:var(--text)}.textarea{min-height:92px;resize:vertical}
.month-head{font-weight:800;color:var(--green-dark);margin:18px 0 8px}.photo-thumb{width:74px;height:74px;border-radius:14px;object-fit:cover;background:var(--green-soft)}
.loading{text-align:center;padding-top:26vh}.sprout{font-size:74px;animation:pulse 1.2s infinite}@keyframes pulse{50%{transform:scale(1.08)}}
.print-only{display:none}
@media(max-width:350px){h1{font-size:24px}.photo-grid,.region-grid{grid-template-columns:1fr}}
@media print{body{background:#fff}.screen{padding:10mm;min-height:auto}.bottom-nav,.no-print,.btn{display:none!important}.print-only{display:block}.card{box-shadow:none;break-inside:avoid}}

</style>
</head>
<body>
  <div id="app" class="app"></div>
  <script>
const KEY='balconyGardenMVP_v1';
const $=s=>document.querySelector(s);
const app=$('#app');

const Q=[
 {type:'multi',max:2,exclusive:[3],title:'ベランダガーデニングで、まず何を楽しみたいですか？',hint:'複数選択できます（最大2つ）。「まだ分からない」は単独で選びます。',choices:[['🌸','花'],['🌿','緑のある暮らし'],['🥬','野菜・ハーブ'],['🤔','まだ分からない']]},
 {type:'single',title:'ベランダには、どのくらい日が当たりますか？',hint:'だいたいで大丈夫です。',choices:[['🌅','朝〜昼'],['🌇','昼〜夕方'],['☀️','一日かなり'],['☁️','あまり当たらない'],['❓','分からない']]},
 {type:'single',title:'ベランダの横幅はどのくらいですか？',hint:'両手を広げた幅を目安にしてください。',choices:[['↔️','両手を広げた幅の半分'],['🙆','1倍くらい'],['📏','1.5倍くらい'],['🏠','2倍以上'],['❓','今は分からない・後で確認']]},
 {type:'single',title:'ベランダの奥行きはどのくらいですか？',hint:'普通に歩いた時の一歩を目安にしてください。',choices:[['👣','半歩くらい'],['🚶','1歩くらい'],['🚶‍♂️','1.5〜2歩くらい'],['↔️','2歩以上'],['❓','今は分からない・後で確認']]},
 {type:'single',title:'ベランダの風はどのくらい強いですか？',hint:'普段の印象で選んでください。',choices:[['🍃','あまり強くない'],['🌬️','ときどき強い'],['💨','かなり強い'],['🍂','季節によって違う'],['❓','分からない']]},
 {type:'multi',max:3,exclusive:[3,4],title:'植物を置かない方がよい場所はありますか？',hint:'複数選択できます。安全な配置を考えるために使います。',choices:[['❄️','室外機のまわり'],['🚪','避難ハッチ・避難経路'],['💧','排水口のまわり'],['✅','特にない'],['❓','分からない']]},
 {type:'single',title:'水やりなど、植物のお世話はどれくらいなら続けられそうですか？',hint:'無理なく続けられそうなものを選んでください。',choices:[['🫧','できるだけ手入れを少なくしたい'],['🗓️','2〜3日に1回くらい'],['💧','毎日少しならできる'],['🌿','週末を中心にしたい'],['❓','まだ分からない']]},
 {type:'budget',title:'今回の予算は、どれくらいにしますか？',hint:'0〜10,000円の範囲で選べます。今決めなくても大丈夫です。'},
 {type:'multi',max:3,exclusive:[3],title:'今あるものはありますか？',hint:'複数選択できます。今あるものをできるだけ活かします。',choices:[['🌿','植物'],['🪴','鉢・プランター'],['✂️','園芸道具'],['📦','特にない']]},
 {type:'single',title:'どんな雰囲気が好みですか？',hint:'今の気分で選んで大丈夫です。',choices:[['🌳','緑が多いナチュラル'],['🌸','花があって明るい'],['◻️','すっきりシンプル'],['🥬','野菜・ハーブ中心'],['❓','まだ分からない']]},
 {type:'single',region:true,title:'お住まいの地域を教えてください',hint:'気候の目安に使います。都道府県や住所は必要ありません。',choices:[['🗾','北海道'],['🗾','東北'],['🗾','関東'],['🗾','北陸・甲信越'],['🗾','東海'],['🗾','近畿'],['🗾','中国'],['🗾','四国'],['🗾','九州'],['🗾','沖縄'],['…','答えたくない']]},
 {type:'single',title:'小さい子どもやペットはいますか？',hint:'安全な植物や置き場所を考えるために使います。',choices:[['🧒','小さい子どもがいる'],['🐾','ペットがいる'],['👨‍👩‍👧','両方いる'],['🏡','どちらもいない'],['…','答えたくない']]}
];

const PLANTS=[
 {id:'basil',name:'バジル',emoji:'🌿',style:['野菜・ハーブ中心','緑が多いナチュラル'],sun:['朝〜昼','昼〜夕方','一日かなり'],care:['毎日少しならできる','2〜3日に1回くらい'],ease:4,pot:'直径約18cm（6号）',water:'土の表面が乾いたら。暑い時期は毎日確認。',why:'育て始めやすく、少量から料理にも使いやすい。',price:350,season:'春〜秋'},
 {id:'mint',name:'ミント',emoji:'🌱',style:['緑が多いナチュラル','野菜・ハーブ中心'],sun:['朝〜昼','あまり当たらない','昼〜夕方'],care:['できるだけ手入れを少なくしたい','2〜3日に1回くらい','週末を中心にしたい'],ease:5,pot:'直径約18cm（6号）',water:'土の表面が乾き始めたら。乾燥させすぎない。',why:'丈夫で香りも楽しみやすい。広がりやすいので鉢植え向き。',price:300,season:'春〜秋'},
 {id:'rosemary',name:'ローズマリー',emoji:'🌿',style:['緑が多いナチュラル','すっきりシンプル'],sun:['朝〜昼','昼〜夕方','一日かなり'],care:['できるだけ手入れを少なくしたい','週末を中心にしたい'],ease:4,pot:'直径約21cm（7号）',water:'土がしっかり乾いてから。過湿を避ける。',why:'比較的乾燥に強く、少ない手入れで香りを楽しめる。',price:500,season:'通年目安'},
 {id:'thyme',name:'タイム',emoji:'🌿',style:['緑が多いナチュラル','すっきりシンプル'],sun:['朝〜昼','昼〜夕方','一日かなり'],care:['できるだけ手入れを少なくしたい','週末を中心にしたい'],ease:4,pot:'直径約15〜18cm（5〜6号）',water:'土が乾いてから。蒸れに注意。',why:'コンパクトで省スペース。小さく始めやすい。',price:350,season:'春・秋中心'},
 {id:'pansy',name:'パンジー／ビオラ',emoji:'🌼',style:['花があって明るい'],sun:['朝〜昼','昼〜夕方','一日かなり'],care:['2〜3日に1回くらい','毎日少しならできる'],ease:4,pot:'直径約15〜18cm（5〜6号）',water:'土の表面が乾いたら。花や葉にかけすぎない。',why:'小さな鉢1つでも雰囲気が変わりやすい。',price:250,season:'秋〜春'},
 {id:'lettuce',name:'リーフレタス',emoji:'🥬',style:['野菜・ハーブ中心'],sun:['朝〜昼','昼〜夕方'],care:['2〜3日に1回くらい','毎日少しならできる'],ease:4,pot:'直径約18〜21cm（6〜7号）',water:'土の表面が乾いたら。乾燥させすぎない。',why:'少量から収穫でき、ベランダ菜園の達成感が得やすい。',price:250,season:'春・秋'},
 {id:'parsley',name:'パセリ',emoji:'🌿',style:['野菜・ハーブ中心','緑が多いナチュラル'],sun:['朝〜昼','あまり当たらない','昼〜夕方'],care:['2〜3日に1回くらい','週末を中心にしたい'],ease:4,pot:'直径約15〜18cm（5〜6号）',water:'土の表面が乾いたら。',why:'比較的小さく育てられ、料理に少しずつ使いやすい。',price:300,season:'春・秋'},
 {id:'heuchera',name:'ヒューケラ',emoji:'🍃',style:['緑が多いナチュラル','すっきりシンプル'],sun:['朝〜昼','あまり当たらない'],care:['できるだけ手入れを少なくしたい','週末を中心にしたい'],ease:4,pot:'直径約18〜21cm（6〜7号）',water:'土の表面が乾いたら。夏の蒸れに注意。',why:'葉色を楽しみやすく、花が少なくても雰囲気を作りやすい。',price:700,season:'通年目安'},
 {id:'sedum',name:'セダム',emoji:'🪴',style:['すっきりシンプル','緑が多いナチュラル'],sun:['朝〜昼','昼〜夕方','一日かなり'],care:['できるだけ手入れを少なくしたい','週末を中心にしたい'],ease:5,pot:'直径約12〜15cm（4〜5号）',water:'土が乾いて数日してから。水のやりすぎに注意。',why:'小鉢から始めやすく、手入れを増やしすぎたくない人向き。',price:350,season:'通年目安'},
 {id:'snapdragon',name:'キンギョソウ',emoji:'🌸',style:['花があって明るい'],sun:['朝〜昼','昼〜夕方','一日かなり'],care:['2〜3日に1回くらい','毎日少しならできる'],ease:3,pot:'直径約18〜21cm（6〜7号）',water:'土の表面が乾いたら。蒸れを避ける。',why:'縦の高さが出て、鉢1つでも景色に変化をつけやすい。',price:350,season:'秋〜春'}
];

function freshState(){return{view:'start',qi:0,answers:{},photoFlags:{},plan:null,todos:[],shopping:[],candidates:[],diary:[],helpHistory:[],progress:0,revision:{}}}
let state=load();
function load(){try{return Object.assign(freshState(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return freshState()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function choiceText(i){const q=Q[i],a=state.answers[i];if(q.type==='budget'){if(!a)return'未回答';return a.undecided?'まだ決めていない':`${Number(a.amount).toLocaleString()}円`}if(q.type==='multi'){return Array.isArray(a)&&a.length?a.map(x=>q.choices[x][1]).join('、'):'未回答'}return a===undefined?'未回答':q.choices[a][1]}
function navigate(v){state.view=v;save();render();window.scrollTo({top:0,behavior:'instant'})}
function nav(active='home'){return `<nav class="bottom-nav no-print"><button class="${active==='home'?'active':''}" onclick="navigate('home')"><strong>⌂</strong>ホーム</button><button class="${active==='plan'?'active':''}" onclick="navigate('plan')"><strong>🌱</strong>プラン</button><button class="${active==='diary'?'active':''}" onclick="navigate('diary')"><strong>🌿</strong>日和</button><button class="${active==='help'?'active':''}" onclick="navigate('help')"><strong>?</strong>相談</button></nav>`}

function render(){
 const v=state.view;
 if(v==='start')return renderStart(); if(v==='q')return renderQuestion(); if(v==='photos')return renderPhotos(); if(v==='summary')return renderSummary(); if(v==='loading')return renderLoading(); if(v==='ready')return renderReady(); if(v==='home')return renderHome(); if(v==='plan')return renderPlan(); if(v==='plant')return renderPlant(); if(v==='shopping')return renderShopping(); if(v==='todo')return renderTodo(); if(v==='next')return renderNextPlant(); if(v==='diary')return renderDiary(); if(v==='help')return renderHelp(); if(v==='revise')return renderRevise();
}

function renderStart(){app.innerHTML=`<section class="screen"><div class="tag">ベランダガーデニングロードマップ</div><div class="hero"><h1>ベランダガーデニングを、無理なくはじめよう 🌱</h1><p>理想の完成形からではなく、あなたのベランダでできる「最初の一歩」から考えます。</p><div class="mockimg">🪴 🌿</div><button class="btn primary" onclick="startQuestions()">ガーデンプランを作る</button><button class="btn ghost" onclick="resumeApp()">前回の続きから</button><p class="muted">無料で動くWeb版MVPです。写真は任意。本物のAI画像解析はまだ使いません。</p></div></section>`}
function startQuestions(){state.qi=0;state.answers={};state.photoFlags={};state.view='q';save();render()}
function resumeApp(){state.view=state.plan?'home':'q';save();render()}

function renderQuestion(){const i=state.qi,q=Q[i];let body='';if(q.type==='budget'){const a=state.answers[i]||{amount:3000,undecided:false};body=`<div class="range-wrap"><div class="range-value" id="budgetValue">${a.undecided?'まだ決めていない':Number(a.amount).toLocaleString()+'円'}</div><input type="range" min="0" max="10000" step="500" value="${a.amount??3000}" ${a.undecided?'disabled':''} oninput="setBudget(this.value)"><div class="range-labels"><span>0円</span><span>5,000円</span><span>10,000円</span></div><button class="answer ${a.undecided?'sel':''}" onclick="toggleUndecided()"><span class="ico">🤔</span><span>まだ決めていない</span><span class="mark">${a.undecided?'✓':''}</span></button></div>`}else{const wrap=q.region?'region-grid':'';body=`<div class="${wrap}">${q.choices.map((c,idx)=>`<button class="answer ${isSelected(i,idx)?'sel':''}" onclick="selectAnswer(${idx})"><span class="ico">${c[0]}</span><span>${c[1]}</span><span class="mark">${markFor(q,i,idx)}</span></button>`).join('')}</div>`}
 app.innerHTML=`<section class="screen"><div class="tag">質問 ${i+1}/12</div><div class="progress"><span style="width:${((i+1)/12)*100}%"></span></div><h1>${esc(q.title)}</h1><p class="muted">${esc(q.hint)}</p>${body}<div class="nav-row"><button class="btn ghost" onclick="prevQuestion()">戻る</button><button class="btn primary" onclick="nextQuestion()">次へ</button></div></section>`}
function isSelected(i,idx){const q=Q[i],a=state.answers[i];return q.type==='multi'?Array.isArray(a)&&a.includes(idx):a===idx}
function markFor(q,i,idx){return q.type==='multi'?(isSelected(i,idx)?'☑':'☐'):(isSelected(i,idx)?'●':'○')}
function selectAnswer(idx){const i=state.qi,q=Q[i];if(q.type==='single')state.answers[i]=idx;else{let cur=Array.isArray(state.answers[i])?[...state.answers[i]]:[];if(q.exclusive.includes(idx))cur=[idx];else{cur=cur.filter(x=>!q.exclusive.includes(x));if(cur.includes(idx))cur=cur.filter(x=>x!==idx);else{if(cur.length>=q.max)return alert(q.max===2?'2つまで選べます。':'これ以上は選べません。');cur.push(idx)}}state.answers[i]=cur}save();renderQuestion()}
function setBudget(v){state.answers[state.qi]={amount:Number(v),undecided:false};save();$('#budgetValue').textContent=Number(v).toLocaleString()+'円'}
function toggleUndecided(){const i=state.qi,a=state.answers[i]||{amount:3000,undecided:false};state.answers[i]={amount:a.amount??3000,undecided:!a.undecided};save();renderQuestion()}
function answered(i){const q=Q[i],a=state.answers[i];if(q.type==='multi')return Array.isArray(a)&&a.length>0;if(q.type==='budget')return !!a;return a!==undefined}
function nextQuestion(){const i=state.qi,q=Q[i];if(q.type==='budget'&&!state.answers[i])state.answers[i]={amount:3000,undecided:false};if(!answered(i))return alert(q.type==='multi'?'1つ以上選んでください。':'1つ選んでください。');if(i<11){state.qi++;save();renderQuestion();window.scrollTo(0,0)}else navigate('photos')}
function prevQuestion(){if(state.qi>0){state.qi--;save();renderQuestion();window.scrollTo(0,0)}else navigate('start')}

const photoSession={};
function renderPhotos(){app.innerHTML=`<section class="screen"><div class="tag">写真アップロード</div><h1>今あるものを見せてください</h1><p class="muted">写真なしでも進めます。ただし写真があると、今ある鉢・植物・置けそうな場所・安全面をより具体的に確認できます。</p><div class="photo-grid">${photoBox('balcony','📷','ベランダ全体','おすすめ')}${photoBox('pots','🪴','鉢・プランター','任意')}${photoBox('plants','🌿','今ある植物','任意')}${photoBox('tools','✂️','園芸道具','任意')}</div><div class="notice">📷 写真なしの場合は、写真を見たふりをして鉢・植物・置き場所などを推測しません。</div><div class="nav-row"><button class="btn ghost" onclick="backToQ()">戻る</button><button class="btn primary" onclick="navigate('summary')">次へ</button></div></section>`;Object.entries(photoSession).forEach(([id,url])=>{const el=document.getElementById('ph-'+id);if(el)el.innerHTML=`<img src="${url}">`})}
function photoBox(id,emoji,label,note){return `<label class="upload"><div class="ph" id="ph-${id}">${emoji}</div><b>${label}</b><br><span class="muted">${note}</span><input type="file" accept="image/*" onchange="previewPhoto(event,'${id}')"></label>`}
function previewPhoto(e,id){const f=e.target.files?.[0];if(!f)return;photoSession[id]=URL.createObjectURL(f);state.photoFlags[id]=true;save();const el=document.getElementById('ph-'+id);el.innerHTML=`<img src="${photoSession[id]}">`}
function backToQ(){state.qi=11;state.view='q';save();render()}

function renderSummary(){const hasPhoto=Object.keys(state.photoFlags).length>0;app.innerHTML=`<section class="screen"><div class="tag">入力内容の確認</div><h1>${hasPhoto?'写真と回答を受け取りました':'写真なしで進めます'}</h1><div class="notice">${hasPhoto?'<b>写真は参考にできます。</b><br><span class="muted">ただし、このMVPでは本物の画像解析はまだ接続していません。</span>':'<b>12問への回答だけでプランを作ります。</b><br><span class="muted">写真由来の情報は推測しません。</span>'}</div><div class="card"><h2>回答内容</h2>${Q.map((q,i)=>`<div class="summary-row"><div class="summary-key">${i+1}. ${esc(shortLabel(i))}</div><div class="summary-val">${esc(choiceText(i))}</div></div>`).join('')}</div><div class="nav-row"><button class="btn ghost" onclick="navigate('photos')">戻る</button><button class="btn primary" onclick="generatePlan()">プランを作る</button></div></section>`}
function shortLabel(i){return['楽しみたいこと','日当たり','横幅','奥行き','風','置かない場所','お世話','予算','今あるもの','好み','地域','子ども・ペット'][i]}

function renderLoading(){app.innerHTML=`<section class="screen"><div class="loading"><div class="sprout">🌱</div><h2 id="loadtext">日当たりを確認しています…</h2><p class="muted">安全 → 育てやすさ → 手持ち活用 → 予算 → 見た目 の順で考えます。</p></div></section>`}
function generatePlan(){state.view='loading';save();renderLoading();const steps=['日当たりを確認しています…','風や安全面を確認しています…','今あるものを活かせるか見ています…','予算とお世話の負担を確認しています…','最初の一歩を整えています…'];let i=0;const t=setInterval(()=>{i++;if(i>=steps.length){clearInterval(t);state.plan=buildPlan();state.todos=makeTodos(state.plan);state.shopping=makeShopping(state.plan);state.progress=1;state.view='ready';save();render()}else $('#loadtext').textContent=steps[i]},600)}
function buildPlan(){const prefs=choiceText(9),sun=choiceText(1),care=choiceText(6),budget=state.answers[7]?.undecided?null:(state.answers[7]?.amount??3000),family=state.answers[11];let scored=PLANTS.map(p=>{let s=0;if(p.style.includes(prefs))s+=4;if(p.sun.includes(sun))s+=3;if(p.care.includes(care))s+=3;if(p.ease>=4)s+=1;if(budget!==null&&p.price<=Math.max(500,budget/3))s+=1;return{...p,score:s}}).sort((a,b)=>b.score-a.score);if(family===1||family===2)scored=scored.filter(p=>!['mint','rosemary'].includes(p.id));const plants=scored.slice(0,3);const name=prefs==='花があって明るい'?'小さな花のあるベランダ':prefs==='野菜・ハーブ中心'?'小さく始めるハーブ・菜園':prefs==='すっきりシンプル'?'すっきり育てる小さなベランダ':'小さなナチュラルガーデン';return{name,plants,createdAt:new Date().toISOString(),safety:makeSafety(),zones:Array.isArray(state.answers[5])?state.answers[5]:[],budget}}
function makeSafety(){const zones=Array.isArray(state.answers[5])?state.answers[5]:[],fam=state.answers[11],must=[];if(fam===0||fam===2){must.push('手すり付近に、鉢・棚・椅子・収納・スタンドなど足掛かりになる物を置かない。');must.push('鉢や道具を手すり上・不安定な高所に置かない。')}else must.push('手すり上や不安定な高所には鉢や道具を置かない。');must.push(zones.includes(1)?'避難ハッチ・避難経路を塞がない。':'配置前に避難ハッチ・避難経路の位置を確認する。');if(zones.includes(2))must.push('排水口を鉢や土で塞がない。');if(zones.includes(0))must.push('室外機の吸排気を鉢や棚で妨げない。');if(fam===1||fam===2)must.push('ペットが触れる可能性がある植物は、有毒性や刺激性を購入前に確認する。');return must}
function makeTodos(plan){return[{id:uid(),text:'置き場所と安全エリアを確認する',done:false},{id:uid(),text:'今ある鉢・道具を確認する',done:false},{id:uid(),text:`候補の「${plan.plants[0]?.name||'植物'}」を店頭やネットで確認する`,done:false}]}
function makeShopping(plan){const hasPots=(state.answers[8]||[]).includes(1),hasTools=(state.answers[8]||[]).includes(2);const items=[];plan.plants.slice(0,2).forEach(p=>items.push({id:uid(),tier:'今すぐ必要',name:`${p.name}の苗`,price:p.price,done:false,note:'まずは1鉢からでOK'}));items.push({id:uid(),tier:hasPots?'今回は不要':'今すぐ必要',name:'鉢・プランター',price:hasPots?0:700,done:hasPots,note:hasPots?'今ある鉢を活用':'植物に合うサイズを1つ'});items.push({id:uid(),tier:hasTools?'今回は不要':'あとでOK',name:'じょうろ',price:hasTools?0:500,done:hasTools,note:hasTools?'手持ちを活用':'ペットボトルでも代用可'});return items}
function uid(){return Math.random().toString(36).slice(2,9)}

function renderReady(){app.innerHTML=`<section class="screen"><div class="loading"><div style="font-size:64px">🌿</div><h1>あなたのガーデンプランができました</h1><p class="muted">まずは無理なく始められる範囲だけを出しています。</p><button class="btn primary" onclick="navigate('plan')">結果はこちら</button></div></section>`}

function renderHome(){if(!state.plan)return navigate('start');const done=state.todos.filter(t=>t.done).length;app.innerHTML=`<section class="screen"><div class="homehead"><div class="tag">ホーム</div><h1>こんにちは 🌿</h1><p class="muted">${Math.min(7,state.progress+done)} / 7 ステップ完了 🌱</p></div><div class="card"><div class="section-title"><h2>今日のTODO</h2><button class="link-btn" onclick="navigate('todo')">すべて見る</button></div>${state.todos.slice(0,3).map(todoRow).join('')}${state.todos.length&&state.todos.every(t=>t.done)?'<div class="notice">今日はここまででOK 🌿</div>':''}</div><div class="card"><b>🌱 わたしのガーデンプラン</b><p>${esc(state.plan.name)}</p><button class="btn ghost" onclick="navigate('plan')">プランを見る</button></div><div class="card"><div class="section-title"><b>🛒 買い物リスト</b><button class="link-btn" onclick="navigate('shopping')">見る</button></div><p class="muted">今すぐ必要・あとでOK・今回は不要に分けています。</p></div><div class="card"><b>＋ 次の植物を考える</b><p class="muted">今のベランダ情報を引き継いで、候補を3つ出します。</p><button class="btn secondary" onclick="navigate('next')">考えてみる</button></div><div class="card"><b>🌿 わたしのベランダ日和</b><p class="muted">植物と過ごした時間を、ゆっくりと。</p><button class="btn ghost" onclick="navigate('diary')">開く</button></div><div class="card"><b>気になる植物 ${state.candidates.length}件</b><p class="muted">候補に残した植物をあとから見返せます。</p></div></section>${nav('home')}`}
function todoRow(t){return `<label class="todo-row"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTodo('${t.id}')"><span class="grow ${t.done?'checkline':''}">${esc(t.text)}</span></label>`}
function toggleTodo(id){const t=state.todos.find(x=>x.id===id);if(t)t.done=!t.done;save();render()}

function renderPlan(){if(!state.plan)return navigate('start');const p=state.plan;app.innerHTML=`<section class="screen"><div class="tag">わたしのガーデンプラン</div><h1>${esc(p.name)}</h1><div class="swipe"><div class="slide"><b>まずここまで</b><div class="mockimg">🪴 🌿 🪴</div></div><div class="slide"><b>将来こんな感じ</b><div class="mockimg future">🌿 🪴 🌿 🌸</div></div></div><p class="muted" style="text-align:center">← 左右にスワイプ →</p><div class="card"><h2>最初の植物候補</h2>${p.plants.map(x=>plantMini(x)).join('')}</div><div class="card"><h2>置き場所イメージ</h2>${layoutHtml(p.zones)}<p class="muted">赤い場所は、質問で「置かない方がよい」と回答した場所です。</p></div><div class="warn"><b>🔴 必ず確認</b><ul>${p.safety.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="caution"><b>🟡 できれば注意</b><ul><li>強風時は鉢や道具の転倒・飛散を確認する。</li><li>重い鉢を一か所に集中させない。</li><li>受け皿に水を長時間ためない。</li></ul></div><button class="btn secondary" onclick="navigate('revise')">少し修正する</button><button class="btn ghost" onclick="window.print()">プランをPDF保存</button><p class="micro">iPhoneでは印刷画面からPDFとして保存できます。</p></section>${nav('plan')}`}
function plantMini(x){return `<div class="plant-card" style="margin:14px 0"><div class="plant-emoji">${x.emoji}</div><div><h3>${esc(x.name)}</h3><div class="stars">${'★'.repeat(x.ease)}${'☆'.repeat(5-x.ease)}</div><p class="micro">${esc(x.why)}</p><button class="link-btn" onclick="openPlant('${x.id}')">詳しく見る</button></div></div>`}
function layoutHtml(zones){return `<div class="layout-box"><div class="rail">手すり側</div><div class="door">室内側</div><div class="zone ok1">① 植物候補</div><div class="zone ok2">② 植物候補</div>${zones.includes(0)?'<div class="zone ng1">室外機周辺 NG</div>':''}${zones.includes(2)?'<div class="zone ng2">排水口周辺 NG</div>':''}${zones.includes(1)?'<div class="zone ng3">避難経路 NG</div>':''}</div>`}
function openPlant(id){state.selectedPlant=id;state.view='plant';save();render()}
function renderPlant(){const p=PLANTS.find(x=>x.id===state.selectedPlant)||state.plan?.plants?.[0];if(!p)return navigate('plan');app.innerHTML=`<section class="screen"><div class="tag">植物ページ</div><div class="plant-emoji" style="width:94px;height:94px;font-size:48px;margin-top:10px">${p.emoji}</div><h1>${esc(p.name)}</h1><span class="pill">育てやすさ ${'★'.repeat(p.ease)}</span><span class="pill gray">${esc(p.season)}</span><div class="card"><h2>選んだ理由</h2><p>${esc(p.why)}</p></div><div class="card"><h2>育て方の目安</h2><p><b>水やり：</b>${esc(p.water)}</p><p><b>鉢：</b>${esc(p.pot)}</p><p><b>おすすめ位置：</b>${esc(choiceText(1))}の日当たりを参考に、強風や避難経路を避ける。</p></div><div class="caution"><b>注意</b><p class="muted">植物の安全性は、子ども・ペットが触れる可能性がある場合、購入前に園芸店や信頼できる植物情報で確認してください。</p></div><button class="btn ghost" onclick="navigate('plan')">プランへ戻る</button></section>${nav('plan')}`}

function renderShopping(){const tiers=['今すぐ必要','あとでOK','今回は不要'];app.innerHTML=`<section class="screen"><div class="tag">買い物リスト</div><h1>買いすぎないためのリスト</h1>${tiers.map(t=>`<div class="card"><h2>${t}</h2>${state.shopping.filter(x=>x.tier===t).length?state.shopping.filter(x=>x.tier===t).map(shopRow).join(''):'<div class="empty">該当なし</div>'}</div>`).join('')}<div class="notice"><b>目安合計：</b>${state.shopping.filter(x=>x.tier!=='今回は不要'&&!x.done).reduce((s,x)=>s+x.price,0).toLocaleString()}円</div></section>${nav('home')}`}
function shopRow(x){return `<label class="shop-row"><input type="checkbox" ${x.done?'checked':''} onchange="toggleShop('${x.id}')"><div class="grow ${x.done?'checkline':''}"><b>${esc(x.name)}</b><div class="micro">目安 ${x.price.toLocaleString()}円｜${esc(x.note)}</div></div></label>`}
function toggleShop(id){const x=state.shopping.find(s=>s.id===id);if(x)x.done=!x.done;save();render()}

function renderTodo(){app.innerHTML=`<section class="screen"><div class="tag">TODO</div><h1>今日やること</h1><div class="card">${state.todos.map(todoRow).join('')||'<div class="empty">TODOはありません。</div>'}</div><div class="card"><h2>自分で追加</h2><div class="form-row"><input id="newTodo" class="text-input" placeholder="例：鉢の置き場所を測る"></div><button class="btn primary" onclick="addTodo()">追加する</button></div>${state.todos.length&&state.todos.every(t=>t.done)?'<div class="notice">今日はここまででOK 🌿</div>':''}</section>${nav('home')}`}
function addTodo(){const v=$('#newTodo').value.trim();if(!v)return;state.todos.push({id:uid(),text:v,done:false});save();renderTodo()}

function renderNextPlant(){const used=new Set(state.plan?.plants.map(p=>p.id)||[]),pool=PLANTS.filter(p=>!used.has(p.id));const prefs=choiceText(9),sun=choiceText(1),care=choiceText(6);const options=pool.map(p=>({...p,score:(p.style.includes(prefs)?4:0)+(p.sun.includes(sun)?3:0)+(p.care.includes(care)?3:0)})).sort((a,b)=>b.score-a.score).slice(0,3);state.nextOptions=options.map(x=>x.id);save();app.innerHTML=`<section class="screen"><div class="tag">次の植物を考える</div><h1>前回から変わったことはありますか？</h1><p class="muted">大きな変更がなければ、そのまま候補を見て大丈夫です。</p><div class="card"><div class="form-row"><label>今のベランダで気に入っていること・変えたいこと</label><textarea id="changeNote" class="textarea" placeholder="例：緑は気に入っている。もう少し花を足したい。"></textarea></div></div><h2>今回の候補</h2>${options.map(nextCard).join('')}<button class="btn ghost" onclick="navigate('home')">今回は増やさない</button></section>${nav('home')}`}
function nextCard(p){return `<div class="card plant-card"><div class="plant-emoji">${p.emoji}</div><div><h3>${esc(p.name)}</h3><p class="micro">${esc(p.why)}</p><div class="nav-row"><button class="btn secondary" onclick="keepCandidate('${p.id}')">候補に残す</button><button class="btn primary" onclick="addPlant('${p.id}')">これにする</button></div></div></div>`}
function keepCandidate(id){if(!state.candidates.includes(id))state.candidates.push(id);save();alert('「気になる植物」に残しました。')}
function addPlant(id){const p=PLANTS.find(x=>x.id===id);if(!p)return;if(!state.plan.plants.find(x=>x.id===id))state.plan.plants.push(p);state.diary.unshift({id:uid(),date:new Date().toISOString().slice(0,10),type:'植物を追加',text:`${p.name}をプランに追加しました。`,photo:null,auto:true});state.progress=Math.min(7,state.progress+1);save();navigate('plan')}

function renderDiary(){const groups=groupDiary();app.innerHTML=`<section class="screen"><div class="tag">わたしのベランダ日和</div><h1>植物と過ごした時間を、ゆっくりと。</h1><div class="card"><h2>今日を残す</h2><div class="form-row"><label>ひとこと</label><textarea id="diaryText" class="textarea" placeholder="例：新しい葉が1枚増えていた。"></textarea></div><div class="form-row"><label>写真（任意）</label><input id="diaryPhoto" class="text-input" type="file" accept="image/*"></div><button class="btn primary" onclick="addDiary()">残す</button></div>${Object.keys(groups).length?Object.entries(groups).map(([m,items])=>`<div class="month-head">${m}</div><div class="card">${monthComment(items)}${items.map(diaryRow).join('')}</div>`).join(''):'<div class="card empty">まだ記録はありません。最初の1枚やひとことからで大丈夫です。</div>'}</section>${nav('diary')}`}
function groupDiary(){return state.diary.reduce((g,x)=>{const m=(x.date||'').slice(0,7)||'日付なし';(g[m]??=[]).push(x);return g},{})}
function monthComment(items){const manual=items.filter(x=>!x.auto).length;return `<div class="notice"><b>今月のひとこと</b><br><span class="muted">${manual?'少しずつ、ベランダで過ごした時間が残っています。':'植物を迎えた出来事が記録されています。'}</span></div>`}
function diaryRow(x){return `<div class="timeline-row">${x.photo?`<img class="photo-thumb" src="${x.photo}">`:`<div class="plant-emoji" style="width:58px;height:58px;font-size:26px">${x.auto?'🌱':'📷'}</div>`}<div class="grow"><b>${esc(x.date)}</b><div>${esc(x.text)}</div>${x.auto?'<span class="pill gray">自動記録</span>':''}</div><button class="link-btn" onclick="deleteDiary('${x.id}')">削除</button></div>`}
async function addDiary(){const text=$('#diaryText').value.trim();const file=$('#diaryPhoto').files?.[0];if(!text&&!file)return alert('ひとことか写真のどちらかを追加してください。');let photo=null;if(file)photo=await compressImage(file);state.diary.unshift({id:uid(),date:new Date().toISOString().slice(0,10),type:'メモ',text:text||'写真を残しました。',photo,auto:false});save();renderDiary()}
function deleteDiary(id){state.diary=state.diary.filter(x=>x.id!==id);save();renderDiary()}
function compressImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=900,scale=Math.min(1,max/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.68))};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}

function renderHelp(){app.innerHTML=`<section class="screen"><div class="tag">困ったとき相談</div><h1>まずやることを、短く整理します</h1><div class="card"><div class="form-row"><label>困っていること</label><select id="helpCat" class="select-input"><option>葉の元気がない</option><option>虫がいる</option><option>水やりが分からない</option><option>植え替えたい</option><option>その他</option></select></div><div class="form-row"><label>状況</label><textarea id="helpText" class="textarea" placeholder="例：葉の先が茶色くなっています。"></textarea></div><div class="form-row"><label>写真（任意）</label><input id="helpPhoto" class="text-input" type="file" accept="image/*"></div><button class="btn primary" onclick="answerHelp()">まずやることを見る</button></div><div id="helpAnswer"></div></section>${nav('help')}`}
function answerHelp(){const cat=$('#helpCat').value,text=$('#helpText').value.trim();const map={'葉の元気がない':['まず土の乾き具合と、直射日光・強風の当たり方を確認してください。','葉全体・葉の表裏・土の表面の写真があると判断しやすくなります。'],'虫がいる':['まず他の鉢から少し離し、虫の数と葉の裏を確認してください。','虫のアップと植物全体の写真があると、園芸店でも相談しやすくなります。'],'水やりが分からない':['指で土の表面を触り、乾いているか確認してから水やりしてください。','植物名・鉢サイズ・日当たりが分かると頻度を絞れます。'],'植え替えたい':['鉢底から根が出ているか、水がしみ込みにくくなっていないか確認してください。','植え替え前に植物名と今の鉢サイズを確認すると安全です。'],'その他':['まず植物全体と土、置き場所の状態を確認してください。','判断できない場合は、写真を持って園芸店で相談するのが確実です。']};const ans=map[cat];$('#helpAnswer').innerHTML=`<div class="card"><h2>まずやること</h2><p>${esc(ans[0])}</p><div class="notice">${esc(ans[1])}</div><p class="micro">このMVPは診断を確定するものではありません。原因が分からない、急速に悪化している場合は園芸店など専門家に相談してください。</p></div>`;state.helpHistory.unshift({id:uid(),date:new Date().toISOString().slice(0,10),cat,text,answer:ans[0]});save()}

function renderRevise(){const a=state.answers[7]||{amount:3000,undecided:false};app.innerHTML=`<section class="screen"><div class="tag">プランを少し修正</div><h1>変えたいところだけ調整します</h1><div class="card"><div class="form-row"><label>雰囲気</label><select id="revStyle" class="select-input">${Q[9].choices.map((c,i)=>`<option value="${i}" ${state.answers[9]===i?'selected':''}>${c[1]}</option>`).join('')}</select></div><div class="form-row"><label>予算</label><input id="revBudget" type="range" min="0" max="10000" step="500" value="${a.amount??3000}" oninput="document.getElementById('revBVal').textContent=Number(this.value).toLocaleString()+'円'"><div class="range-value" id="revBVal">${Number(a.amount??3000).toLocaleString()}円</div></div><p class="muted">植物候補と買い物リストだけを更新します。安全条件は残します。</p><button class="btn primary" onclick="applyRevision()">この内容で更新</button><button class="btn ghost" onclick="navigate('plan')">戻る</button></div></section>${nav('plan')}`}
function applyRevision(){state.answers[9]=Number($('#revStyle').value);state.answers[7]={amount:Number($('#revBudget').value),undecided:false};const oldSafety=state.plan.safety,stateZones=state.plan.zones;state.plan=buildPlan();state.plan.safety=oldSafety;state.plan.zones=stateZones;state.shopping=makeShopping(state.plan);save();navigate('plan')}

render();

</script>
